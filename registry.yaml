# Which skills go into which repos.
#   scope: global → every repo
#   scope: stack  → repos with one of `stacks` in their .gilde.json `stacks`
# Repos can add skills with `skills.include` and drop them with `skills.exclude` in .gilde.json.
# Stacks: spring-boot, nestjs, nextjs, node, other
skills:
  - name: write-agents-md
    scope: global

  - name: typeorm-snake-case-columns
    scope: stack
    stacks: [nestjs, node]

  - name: typeorm-queries-and-transactions
    scope: stack
    stacks: [nestjs, node]

  - name: write-adr
    scope: global

  - name: verify-prerequisites
    scope: global

  - name: nextjs-component-tests
    scope: stack
    stacks: [nextjs]
